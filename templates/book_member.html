<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Pavilion - Member Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }
    .booking-container {
      width: 100%;
      max-width: 600px;
      padding: 15px;
    }
    .booking-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      padding: 35px;
    }
    .form-control, .form-select {
      background-color: #1a1a2e;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 12px;
    }
    .form-control:focus, .form-select:focus {
      background-color: #1a1a2e;
      border-color: #00fff0;
      color: #fff;
      box-shadow: 0 0 8px rgba(0, 255, 240, 0.2);
    }
    .form-label {
      font-weight: 500;
      color: #aaa;
      margin-bottom: 8px;
    }
    .premium-badge {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      display: inline-block;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    .btn-submit {
      background: linear-gradient(135deg, #0f3460 0%, #00fff0 100%);
      border: none;
      color: #1a1a2e;
      padding: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 255, 240, 0.3);
      color: #1a1a2e;
    }
    .btn-cancel {
      color: #aaa;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-cancel:hover {
      color: #ff6b6b;
    }
    .text-accent {
      color: #00fff0;
    }
  </style>
</head>
<body>

  <div class="booking-container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <div class="booking-card">
      <div class="text-center">
        <div class="premium-badge text-uppercase fw-bold">⭐ Premium Member Benefit</div>
        <h2 class="fw-bold mb-2">Express <span class="text-accent">Reservation</span></h2>
        <p class="text-muted mb-4">Select your court or zone. Your account rates and profile are automatically applied.</p>
      </div>

      <form method="POST" action="{% url 'book_member' %}">
        {% csrf_token %}
        
        <div class="mb-4">
          <label for="play_unit" class="form-label">Select Arena Facility Unit</label>
          <select class="form-select" id="play_unit" name="play_unit" required>
            <option value="" disabled selected>Choose target play unit...</option>
            {% for unit in play_units %}
              <option value="{{ unit.unit_id }}">
                {{ unit.facility.facility_name }} — Unit {{ unit.unit_num }} 
                {% if unit.unit_status != 'Available' %} (Occupied) {% endif %}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="row mb-4">
          <div class="col-md-4">
            <label for="date" class="form-label">Reservation Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>
          <div class="col-md-4">
            <label for="start_time" class="form-label">Start Window</label>
            <input type="time" class="form-control" id="start_time" name="start_time" required>
          </div>
          <div class="col-md-4">
            <label for="end_time" class="form-label">End Window</label>
            <input type="time" class="form-control" id="end_time" name="end_time" required>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-submit text-uppercase">Secure Member Slot 🔒</button>
        </div>
        
        <div class="text-center mt-3">
          <a href="/" class="btn-cancel small">Return to Dashboard</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const dateInput = document.getElementById('date');
      const today = new Date().toISOString().split('T')[0];
      dateInput.min = today;
    });
  </script>
</body>
</html>
