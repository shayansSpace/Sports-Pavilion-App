<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Pavilion - Member Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }
    .booking-container {
      width: 100%;
      max-width: 650px;
      padding: 15px;
    }
    .booking-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      padding: 35px;
    }
    .form-control, .form-select {
      background-color: #1a1a2e;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 12px;
    }
    .form-control:focus, .form-select:focus {
      background-color: #1a1a2e;
      border-color: #00fff0;
      color: #fff;
      box-shadow: 0 0 8px rgba(0, 255, 240, 0.2);
    }
    .form-label {
      font-weight: 500;
      color: #aaa;
      margin-bottom: 8px;
    }
    .premium-badge {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid #ffd700;
      color: #ffd700;
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.8rem;
      display: inline-block;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    .btn-submit {
      background: linear-gradient(135deg, #0f3460 0%, #00fff0 100%);
      border: none;
      color: #1a1a2e;
      padding: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 255, 240, 0.3);
      color: #1a1a2e;
    }
    .btn-cancel {
      color: #aaa;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-cancel:hover {
      color: #ff6b6b;
    }
    .text-accent {
      color: #00fff0;
    }
    
    /* 6 Play Unit Grid Layout Styles */
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .unit-radio {
      display: none;
    }
    .unit-card {
      background: #1a1a2e;
      border: 2px solid #0f3460;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
    }
    .unit-card:hover {
      border-color: #00fff0;
    }
    .unit-radio:checked + .unit-card {
      border-color: #00fff0;
      background: rgba(0, 255, 240, 0.05);
      box-shadow: 0 0 10px rgba(0, 255, 240, 0.15);
    }
    .unit-title {
      font-size: 1rem;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="booking-container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <div class="booking-card">
      <div class="text-center">
        <div class="premium-badge text-uppercase fw-bold">⭐ Premium Member Benefit</div>
        <h2 class="fw-bold mb-2">Express <span class="text-accent">Reservation</span></h2>
        <p class="text-muted mb-4">Select your court or zone. Your account rates and profile are automatically applied.</p>
      </div>

      <form method="POST" action="{% url 'book_member' %}" id="bookingForm">
        {% csrf_token %}
        
        <div class="mb-4">
          <label class="form-label d-block mb-2">Select Arena Facility Unit</label>
          <div class="unit-grid">
            {% for unit in play_units %}
              <label class="m-0">
                <input type="radio" name="play_unit" value="{{ unit.unit_id }}" class="unit-radio" required>
                <div class="unit-card">
                  <div class="fw-bold text-accent unit-title">Unit {{ unit.unit_num }}</div>
                  <small class="text-muted d-block">{{ unit.facility.facility_name }}</small>
                </div>
              </label>
            {% endfor %}
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label for="date" class="form-label">Reservation Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>
          <div class="col-md-6">
            <label for="time_slot" class="form-label">Available Time Slots</label>
            <select class="form-select" id="time_slot" name="time_slot" required disabled>
              <option value="" disabled selected>Select unit & date first...</option>
            </select>
          </div>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-submit text-uppercase">Secure Member Slot 🔒</button>
        </div>
        
        <div class="text-center mt-3">
          <a href="/" class="btn-cancel small">Return to Dashboard</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const dateInput = document.getElementById('date');
      const slotSelect = document.getElementById('time_slot');
      const unitRadios = document.querySelectorAll('input[name="play_unit"]');

      // Set lowest calendar limit to today
      const today = new Date().toISOString().split('T')[0];
      dateInput.min = today;

      function updateAvailableSlots() {
        const dateVal = dateInput.value;
        const checkedUnit = document.querySelector('input[name="play_unit"]:checked');
        const unitVal = checkedUnit ? checkedUnit.value : null;

        // Keep dropdown disabled if inputs are incomplete
        if (!dateVal || !unitVal) {
          slotSelect.disabled = true;
          slotSelect.innerHTML = '<option value="" disabled selected>Select unit & date first...</option>';
          return;
        }

        // Fetch requests data from Django via AJAX
        fetch(`?play_unit=${unitVal}&date=${dateVal}`, {
          headers: {
            'X-Requested-With': 'XMLHttpRequest'
          }
        })
        .then(response => response.json())
        .then(data => {
          slotSelect.innerHTML = '<option value="" disabled selected>Choose an active session window...</option>';
          
          data.slots.forEach(slot => {
            const option = document.createElement('option');
            option.value = slot.value;
            
            if (slot.available) {
              option.textContent = slot.display;
            } else {
              option.textContent = slot.display + " (Unavailable 🚫)";
              option.disabled = true; 
              option.style.color = '#ff6b6b'; 
            }
            slotSelect.appendChild(option);
          });

          // Successfully unlock dropdown element
          slotSelect.disabled = false; 
        })
        .catch(error => {
          console.error('Error parsing operational time allocations:', error);
        });
      }

      dateInput.addEventListener('change', updateAvailableSlots);
      unitRadios.forEach(radio => {
        radio.addEventListener('change', updateAvailableSlots);
      });
    });
  </script>
</body>
</html>
