<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports Pavilion - Book as Visitor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #1a1a2e;
        color: #ffffff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
      }
      .booking-container {
        width: 100%;
        max-width: 650px;
        padding: 15px;
      }
      .booking-card {
        background: #16213e;
        border: 1px solid #0f3460;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        padding: 35px;
      }
      .form-control,
      .form-select {
        background-color: #1a1a2e;
        border: 1px solid #0f3460;
        color: #fff;
        padding: 12px;
      }
      .form-control:focus,
      .form-select:focus {
        background-color: #1a1a2e;
        border-color: #00fff0;
        color: #fff;
        box-shadow: 0 0 8px rgba(0, 255, 240, 0.2);
      }
      .form-label {
        font-weight: 500;
        color: #aaa;
        margin-bottom: 8px;
      }
      .section-divider {
        border-top: 1px solid #0f3460;
        margin: 25px 0;
      }
      .section-title {
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #f0c040;
        margin-bottom: 15px;
        font-weight: bold;
      }
      .btn-submit {
        background: linear-gradient(135deg, #0f3460 0%, #f0c040 100%);
        border: none;
        color: white;
        padding: 14px;
        font-weight: bold;
        letter-spacing: 1px;
        border-radius: 8px;
        transition: all 0.3s ease;
      }
      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(255, 251, 0, 0.4);
        color: white;
      }
      .btn-cancel {
        color: #aaa;
        text-decoration: none;
        transition: color 0.2s;
      }
      .btn-cancel:hover {
        color: #f0c040;
      }
    </style>
  </head>
  <body>
    <div class="booking-container">
      {% if messages %} {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} alert-dismissible fade show"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endif %}

      <div class="booking-card">
        <div class="text-center mb-4">
          <h2 class="fw-bold">
            Visitor <span style="color: #f0c040">Booking</span> Portal
          </h2>
          <p class="text-muted">
            Secure your sports arena slot instantly as a walk-in guest.
          </p>
        </div>

        <form method="POST" action="{% url 'book_visitor' %}">
          {% csrf_token %}

          <div class="section-title">1. Guest Identification</div>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="first_name" class="form-label">First Name</label>
              <input
                type="text"
                class="form-control"
                id="first_name"
                name="first_name"
                placeholder="Alex"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="last_name" class="form-label">Last Name</label>
              <input
                type="text"
                class="form-control"
                id="last_name"
                name="last_name"
                placeholder="Smith"
                required
              />
            </div>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input
              type="tel"
              class="form-control"
              id="phone"
              name="phone"
              placeholder="+923331112223"
              required
            />
          </div>

          <div class="section-divider"></div>

          <div class="section-title">2. Arena & Slot Reservation</div>
          <div class="mb-3">
            <label for="play_unit" class="form-label"
              >Select Available Play Unit</label
            >
            <select
              class="form-select"
              id="play_unit"
              name="play_unit"
              required
            >
              <option value="" disabled selected>
                Choose a court / ground / table...
              </option>
              {% for unit in play_units %}
              <option value="{{ unit.unit_id }}">
                {{ unit.facility.facility_name }}{{ unit.unit_num }}
                (${{ unit.facility.sp_hourly_rate }}/hr)
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="row mb-3">
            <div class="col-md-4">
              <label for="date" class="form-label">Target Date</label>
              <input
                type="date"
                class="form-control"
                id="date"
                name="date"
                required
              />
            </div>
            <div class="col-md-4">
              <label for="start_time" class="form-label">Start Time</label>
              <input
                type="time"
                class="form-control"
                id="start_time"
                name="start_time"
                required
              />
            </div>
            <div class="col-md-4">
              <label for="end_time" class="form-label">End Time</label>
              <input
                type="time"
                class="form-control"
                id="end_time"
                name="end_time"
                required
              />
            </div>
          </div>

          <div class="section-divider"></div>

          <div class="section-title">3. Settlement</div>
          <div class="mb-4">
            <label for="payment_method" class="form-label">Payment Mode</label>
            <select
              class="form-select"
              id="payment_method"
              name="payment_method"
              required
            >
              <option value="Cash" selected>Cash Payment</option>
              <option value="Credit Card">Card Terminal</option>
            </select>
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-submit text-uppercase">
              Confirm & Process Booking 🚀
            </button>
          </div>

          <div class="text-center mt-3">
            <a href="/" class="btn-cancel small">Cancel process</a>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const dateInput = document.getElementById("date");
        const today = new Date().toISOString().split("T")[0];
        dateInput.min = today;
      });
    </script>
  </body>
</html>
