<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div
      class="container vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="card shadow-lg p-4" style="width: 450px">
        {% if messages %} {% for message in messages %}
        <div
          class="alert alert-danger alert-dismissible fade show mb-3"
          role="alert"
        >
          <strong>Error:</strong> {{ message }}
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"
          ></button>
        </div>
        {% endfor %} {% endif %}

        <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link {% if active_tab != 'signup' %}active{% endif %} fw-bold"
              id="login-tab"
              data-bs-toggle="tab"
              data-bs-target="#login-pane"
              type="button"
              role="tab"
            >
              Sign In
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link {% if active_tab == 'signup' %}active{% endif %} fw-bold"
              id="signup-tab"
              data-bs-toggle="tab"
              data-bs-target="#signup-pane"
              type="button"
              role="tab"
            >
              Sign Up
            </button>
          </li>
        </ul>

        <div class="tab-content" id="authTabsContent">
          <div
            class="tab-pane fade {% if active_tab != 'signup' %}show active{% endif %}"
            id="login-pane"
            role="tabpanel"
          >
            <form method="POST" action="{% url 'login' %}">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                  type="text"
                  name="username"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary w-100">
                Sign In
              </button>
            </form>
          </div>

          <div
            class="tab-pane fade {% if active_tab == 'signup' %}show active{% endif %}"
            id="signup-pane"
            role="tabpanel"
          >
            <form method="POST" action="{% url 'register' %}">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input
                  type="text"
                  name="username"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input
                  type="email"
                  name="email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                  type="password"
                  name="password"
                  class="form-control"
                  required
                />
              </div>
              <button type="submit" class="btn btn-success w-100">
                Create Account
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
