<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      /* ── CLASSIC DARK THEME STYLING MATRIX ── */
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      /* Card Panel Layering */
      .card {
        background-color: #1e1e1e;
        border: 1px solid #2d2d2d;
        border-radius: 12px;
      }

      /* Custom Input Fields */
      .form-label {
        color: #b3b3b3;
        font-size: 0.9rem;
        font-weight: 500;
      }

      .form-control {
        background-color: #0f3460;
        border: 1px solid #3a3a3a;
        color: #ffffff;
        transition: all 0.2s ease-in-out;
      }

      .form-control:focus {
        background-color: #0f3460;
        border-color: #f0c040; /* Gold Accent Line */
        color: #ffffff;
        box-shadow: 0 0 0 0.25rem rgba(240, 192, 64, 0.15);
      }

      /* Navigation Tabs Overrides */
      .nav-tabs {
        border-bottom: 2px solid #0f3460;
      }

      .nav-link {
        color: #777777;
        border: none !important;
        background: transparent !important;
        padding-bottom: 12px;
        transition: color 0.2s ease;
      }

      .nav-link:hover {
        color: #ffffff;
      }

      .nav-link.active {
        color: #f0c040 !important; /* Gold Neon Selection */
        border-bottom: 2px solid #f0c040 !important;
      }

      /* Buttons Premium Palette */
      .btn-primary-custom {
        background-color: #f0c040;
        border: none;
        color: #121212; /* Swapped to dark text for gold background contrast */
        padding: 10px;
        font-weight: 600;
        border-radius: 6px;
        transition: background 0.2s ease;
      }

      .btn-primary-custom:hover {
        background-color: #dcb030;
      }

      .btn-success-custom {
        background-color: #28a745;
        border: none;
        color: white;
        padding: 10px;
        font-weight: 600;
        border-radius: 6px;
        transition: background 0.2s ease;
      }

      .btn-success-custom:hover {
        background-color: #1e7e34;
      }

      /* Muted Alert Adjustments */
      .alert-danger {
        background-color: #2c1618;
        border-color: #5c1d24;
        color: #f8d7da;
      }
      
      .btn-close {
        filter: invert(1); /* Matches close button with dark interface */
      }
    </style>
  </head>
  <body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
      <div class="card shadow-lg p-4" style="width: 450px">
        
        {% if messages %} 
          {% for message in messages %}
            <div class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
              <strong>Error:</strong> {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %} 
        {% endif %}

        <ul class="nav nav-tabs nav-fill mb-4" id="authTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button
              class="nav-link {% if active_tab != 'signup' %}active{% endif %} fw-bold"
              id="login-tab"
              data-bs-toggle="tab"
              data-bs-target="#login-pane"
              type="button"
              role="tab"
            >
              Login
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button
              class="nav-link {% if active_tab == 'signup' %}active{% endif %} fw-bold"
              id="signup-tab"
              data-bs-toggle="tab"
              data-bs-target="#signup-pane"
              type="button"
              role="tab"
            >
              Signup
        </button>
      </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
      
      <div
        class="tab-pane fade {% if active_tab != 'signup' %}show active{% endif %}"
        id="login-pane"
        role="tabpanel"
      >
        <form method="POST" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" value="{{ typed_login_username|default:'' }}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required />
          </div>
          <button type="submit" class="btn btn-primary-custom w-100">
            Login
          </button>
        </form>
      </div>

      <div
        class="tab-pane fade {% if active_tab == 'signup' %}show active{% endif %}"
        id="signup-pane"
        role="tabpanel"
      >
        <form method="POST" action="{% url 'register' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" value="{{ typed_username|default:'' }}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" value="{{ typed_email|default:'' }}" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required />
          </div>
          
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="password_confirm" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-success-custom w-100">
            Create Account
          </button>
        </form>
      </div>

    </div>
  </div>
</div>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
  crossorigin="anonymous"
></script>
