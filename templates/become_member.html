<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Pavilion - Become a Member</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #1a1a2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 0;
    }
    .membership-container {
      width: 100%;
      max-width: 600px;
      padding: 15px;
    }
    .membership-card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      padding: 35px;
    }
    .form-control, .form-select {
      background-color: #1a1a2e;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 12px;
    }
    .form-control:focus, .form-select:focus {
      background-color: #1a1a2e;
      border-color: #00fff0;
      color: #fff;
      box-shadow: 0 0 8px rgba(0, 255, 240, 0.2);
    }
    .form-label {
      font-weight: 500;
      color: #aaa;
      margin-bottom: 8px;
    }
    .btn-upgrade {
      background: linear-gradient(135deg, #0f3460 0%, #f0c040 100%);
      border: none;
      color: white;
      padding: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    .btn-upgrade:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(246, 250, 0, 0.4);
      color: white;
    }
    .btn-cancel {
      color: #aaa;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-cancel:hover {
      color: #f0c040;
    }
    .brand-accent {
      color: #f0c040;
    }
  </style>
</head>
<body>

  <div class="membership-container">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}

    <div class="membership-card">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Become a <span class="brand-accent">Pavilioner</span></h2>
        <p class="text-muted">Fill out your profile details to activate your premium club access.</p>
      </div>

      <form method="POST" action="{% url 'become_member' %}">
        {% csrf_token %}
        
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="John" required>
          </div>
          <div class="col-md-6">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Doe" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Contact Number</label>
          <input type="tel" class="form-control" id="phone" name="phone" placeholder="+923001234567" required>
        </div>

        <div class="mb-3">
          <label for="plan" class="form-label">Select Membership Plan</label>
          <select class="form-select" id="plan" name="plan" required>
            <option value="" disabled selected>Choose a subscription layout...</option>
            {% for plan in plans %}
              <option value="{{ plan.plan_id }}">
                {{ plan.plan_name }} — ${{ plan.plan_price }} ({{ plan.duration_months }} Months)
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-4">
          <label for="payment_method" class="form-label">Preferred Payment Method</label>
          <select class="form-select" id="payment_method" name="payment_method" required>
            <option value="Cash" selected>Cash at Front Desk</option>
            <option value="Credit Card">Credit / Debit Card</option>
            <option value="Online Transfer">Direct Bank Transfer</option>
          </select>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-upgrade text-uppercase">Activate Membership 🏅</button>
        </div>
        
        <div class="text-center mt-3">
          <a href="/" class="btn-cancel small">Nevermind, take me back</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
